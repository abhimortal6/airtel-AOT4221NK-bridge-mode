name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-mock-router:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install cryptography
      - run: python -W error::DeprecationWarning -m unittest discover -s tests -v

  launcher-unix:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Runs the script when Python is present
        run: sh run-mac-linux.sh --version
      - name: Explains how to install Python when it is missing
        run: |
          mkdir -p "$RUNNER_TEMP/nopy"
          for t in dirname uname; do ln -sf "$(command -v $t)" "$RUNNER_TEMP/nopy/$t"; done
          set +e
          env -i PATH="$RUNNER_TEMP/nopy" /bin/sh run-mac-linux.sh --status > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          test "$rc" -eq 1
          grep -q "Python 3 is not installed" out.txt
          if [ "$(uname -s)" = "Darwin" ]; then grep -q "python.org/downloads/macos" out.txt; else grep -q "sudo apt" out.txt; fi

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runs the script when Python is present
        shell: cmd
        run: |
          set NO_PAUSE=1
          call run-windows.bat --version
          if errorlevel 1 exit /b 1
      - name: Explains how to install Python when it is missing
        shell: cmd
        run: |
          set NO_PAUSE=1
          set "PATH=C:\Windows\System32"
          call run-windows.bat --status > out.txt 2>&1
          if not errorlevel 1 exit /b 1
          type out.txt
          findstr /c:"python.org/downloads/windows" out.txt
          if errorlevel 1 exit /b 1
          exit /b 0
